apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-postgres
  namespace: default
spec:
  instances: 3
  
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"

  bootstrap:
    initdb:
      database: gitea
      owner: gitea
      secret:
        name: gitea-postgres-credentials

  storage:
    size: 5Gi
    storageClass: standard

---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-postgres-credentials
  namespace: default
type: kubernetes.io/basic-auth
stringData:
  username: gitea
  password: "GiteaM300Secure2026!"